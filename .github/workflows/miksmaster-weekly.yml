name: miksmaster-weekly
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 8 * * 1'   # 11:00 МСК по понедельникам
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
      - name: Еженедельный отчёт
        env:
          YANDEX_COOKIE: ${{ secrets.YANDEX_COOKIE }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          WEEKLY_CHAT_ID: ${{ secrets.WEEKLY_CHAT_ID }}
        run: node report-weekly.mjs
      - name: Сохранить снимок (прирост на следующую неделю)
        run: |
          if [ -n "$(git status --porcelain snapshot-weekly.json)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add snapshot-weekly.json
            git commit -m "weekly snapshot $(date -u +%F)"
            git push
          fi
